<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Barb's Brokerage Activity Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            zinc: {
              925: '#111113',
              950: '#09090b',
            }
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #09090b; font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #18181b; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #52525b; }
    .toast-enter { animation: toastIn 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards; }
    .toast-exit { animation: toastOut 0.3s ease-in forwards; }
    @keyframes toastIn { from { opacity:0; transform:translateY(20px) scale(0.95); } to { opacity:1; transform:translateY(0) scale(1); } }
    @keyframes toastOut { from { opacity:1; transform:translateY(0) scale(1); } to { opacity:0; transform:translateY(-10px) scale(0.95); } }
    .spinner { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fade-in { animation: fadeIn 0.4s ease forwards; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    .nav-glow { box-shadow: 0 1px 0 0 rgba(16,185,129,0.15); }
    .card-glow:hover { box-shadow: 0 0 0 1px rgba(16,185,129,0.12), 0 8px 32px rgba(0,0,0,0.4); }
    .metric-card { transition: all 0.2s ease; }
    .metric-card:hover { transform: translateY(-1px); }
    .funnel-bar { transition: width 0.8s cubic-bezier(0.34,1.2,0.64,1); }
    .toggle-track { transition: background-color 0.2s ease; }
    input[type="checkbox"]:checked + .toggle-track { background-color: #10b981; }
    select option { background: #18181b; color: #f4f4f5; }
    .table-row:hover td { background: rgba(16,185,129,0.04); }
    @media (max-width: 640px) {
      .mobile-full { width: 100% !important; }
    }
    .gradient-text {
      background: linear-gradient(135deg, #10b981, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .emerald-ring:focus { outline: none; box-shadow: 0 0 0 2px rgba(16,185,129,0.35); }
    .input-base {
      background: #18181b;
      border: 1px solid #27272a;
      color: #f4f4f5;
      border-radius: 8px;
      padding: 10px 14px;
      width: 100%;
      font-size: 14px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .input-base:focus { outline: none; border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.12); }
    .input-base::placeholder { color: #52525b; }
    .input-error { border-color: #f87171 !important; box-shadow: 0 0 0 3px rgba(248,113,113,0.12) !important; }
    .btn-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary:hover { background: linear-gradient(135deg, #059669, #047857); transform: translateY(-1px); box-shadow: 0 4px 20px rgba(16,185,129,0.3); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .section-divider { border: none; border-top: 1px solid #27272a; margin: 0; }
    .badge { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.03em; }
    .badge-emerald { background: rgba(16,185,129,0.12); color: #10b981; }
    .badge-cyan { background: rgba(6,182,212,0.12); color: #06b6d4; }
    .badge-amber { background: rgba(245,158,11,0.12); color: #f59e0b; }
    .badge-zinc { background: rgba(113,113,122,0.15); color: #a1a1aa; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

// ─────────────────────────────────────────────────────────────────────────────
// CONFIGURATION — Replace with your deployed Google Apps Script Web App URL
// ─────────────────────────────────────────────────────────────────────────────
const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID_HERE/exec";

// ─────────────────────────────────────────────────────────────────────────────
// CONSTANTS
// ─────────────────────────────────────────────────────────────────────────────
const LEAD_SOURCES = [
  "Zillow Showcase",
  "Radio",
  "Sign Calls",
  "Open Houses",
  "Referrals",
  "Walk-ins",
  "Other",
];

const DEFAULT_AGENTS = [
  "Barb",
  "Sarah",
  "Mike",
  "Jessica",
  "Tom",
  "Rachel",
];

const METRIC_KEYS = [
  { key: "leadsReceived",         label: "Leads Received",          icon: "📥", color: "emerald" },
  { key: "appointmentsScheduled", label: "Appointments Scheduled",  icon: "📅", color: "cyan"    },
  { key: "referrals",             label: "Referrals",               icon: "🤝", color: "amber"   },
  { key: "vipSellerSigned",       label: "VIP Seller Signed",       icon: "✍️", color: "emerald" },
  { key: "vipBuyerSigned",        label: "VIP Buyer Signed",        icon: "🏠", color: "cyan"    },
  { key: "showings",              label: "Showings",                icon: "👁️", color: "amber"   },
  { key: "listingsTaken",         label: "Listings Taken",          icon: "📋", color: "emerald" },
  { key: "offersSubmitted",       label: "Offers Submitted",        icon: "📤", color: "cyan"    },
  { key: "underContract",         label: "Under Contract",          icon: "📝", color: "amber"   },
  { key: "closed",                label: "Closed",                  icon: "🏆", color: "emerald" },
  { key: "fiveStarReviews",       label: "Five-Star Reviews",       icon: "⭐", color: "amber"   },
];

const EMPTY_METRICS = () => Object.fromEntries(METRIC_KEYS.map(m => [m.key, 0]));

const STORAGE_KEY = "barb_tracker_v3";

// ─────────────────────────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────────────────────────
function loadLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function saveLocal(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
}

function formatTS(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("en-US", { month:"short", day:"numeric", year:"numeric" })
    + " " + d.toLocaleTimeString("en-US", { hour:"2-digit", minute:"2-digit" });
}

function isToday(iso) {
  const d = new Date(iso), now = new Date();
  return d.toDateString() === now.toDateString();
}

function isThisWeek(iso) {
  const d = new Date(iso), now = new Date();
  const start = new Date(now); start.setDate(now.getDate() - now.getDay());
  start.setHours(0,0,0,0);
  return d >= start;
}

function isThisMonth(iso) {
  const d = new Date(iso), now = new Date();
  return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
}

function filterByTime(logs, timeframe) {
  if (timeframe === "daily")   return logs.filter(l => isToday(l.timestamp));
  if (timeframe === "weekly")  return logs.filter(l => isThisWeek(l.timestamp));
  if (timeframe === "monthly") return logs.filter(l => isThisMonth(l.timestamp));
  return logs;
}

function aggregateMetrics(logs) {
  const totals = EMPTY_METRICS();
  logs.forEach(l => {
    METRIC_KEYS.forEach(m => {
      totals[m.key] = (totals[m.key] || 0) + (Number(l.metrics?.[m.key]) || 0);
    });
  });
  return totals;
}

// ─────────────────────────────────────────────────────────────────────────────
// ICONS (inline SVG components)
// ─────────────────────────────────────────────────────────────────────────────
const IconDashboard = () => (
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
  </svg>
);
const IconLog = () => (
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
  </svg>
);
const IconList = () => (
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
  </svg>
);
const IconSpinner = () => (
  <svg className="spinner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
    <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" strokeLinecap="round"/>
  </svg>
);
const IconCheck = () => (
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
    <polyline points="20 6 9 17 4 12"/>
  </svg>
);
const IconX = () => (
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
  </svg>
);
const IconAlert = () => (
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
  </svg>
);
const IconCloud = () => (
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
  </svg>
);

// ─────────────────────────────────────────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────────────────────────────────────────
function Toast({ toasts, removeToast }) {
  return (
    <div style={{ position:"fixed", bottom:24, right:24, zIndex:9999, display:"flex", flexDirection:"column", gap:10, maxWidth:360 }}>
      {toasts.map(t => (
        <div key={t.id} className="toast-enter" style={{
          background: t.type === "success" ? "linear-gradient(135deg,#064e3b,#065f46)" : t.type === "error" ? "linear-gradient(135deg,#450a0a,#7f1d1d)" : "#18181b",
          border: `1px solid ${t.type === "success" ? "rgba(16,185,129,0.3)" : t.type === "error" ? "rgba(248,113,113,0.3)" : "#3f3f46"}`,
          borderRadius: 12,
          padding: "14px 18px",
          boxShadow: "0 8px 32px rgba(0,0,0,0.5)",
          display:"flex", alignItems:"center", gap:12,
        }}>
          <span style={{ color: t.type === "success" ? "#10b981" : t.type === "error" ? "#f87171" : "#a1a1aa", flexShrink:0 }}>
            {t.type === "success" ? <IconCheck /> : <IconAlert />}
          </span>
          <span style={{ color:"#f4f4f5", fontSize:13, fontWeight:500, flex:1 }}>{t.message}</span>
          <button onClick={() => removeToast(t.id)} style={{ background:"none", border:"none", color:"#71717a", cursor:"pointer", padding:2, display:"flex", flexShrink:0 }}>
            <IconX />
          </button>
        </div>
      ))}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// TOGGLE SWITCH
// ─────────────────────────────────────────────────────────────────────────────
function Toggle({ checked, onChange, label, sublabel }) {
  return (
    <label style={{ display:"flex", alignItems:"center", gap:14, cursor:"pointer", userSelect:"none" }}>
      <div style={{ position:"relative", width:44, height:24, flexShrink:0 }}>
        <input type="checkbox" checked={checked} onChange={e => onChange(e.target.checked)}
          style={{ opacity:0, width:0, height:0, position:"absolute" }} />
        <div style={{
          position:"absolute", inset:0,
          background: checked ? "#10b981" : "#3f3f46",
          borderRadius:999,
          transition:"background 0.2s ease",
        }} />
        <div style={{
          position:"absolute",
          top:2, left: checked ? 22 : 2,
          width:20, height:20,
          background:"white",
          borderRadius:"50%",
          transition:"left 0.2s ease",
          boxShadow:"0 1px 4px rgba(0,0,0,0.3)",
        }} />
      </div>
      <div>
        <div style={{ color:"#f4f4f5", fontSize:14, fontWeight:500 }}>{label}</div>
        {sublabel && <div style={{ color:"#71717a", fontSize:12, marginTop:2 }}>{sublabel}</div>}
      </div>
    </label>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// METRIC COUNTER INPUT (used in log activity form)
// ─────────────────────────────────────────────────────────────────────────────
function CounterInput({ value, onChange, min=0 }) {
  return (
    <div style={{ display:"flex", alignItems:"center", gap:0, background:"#18181b", border:"1px solid #27272a", borderRadius:8, overflow:"hidden" }}>
      <button type="button" onClick={() => onChange(Math.max(min, value - 1))}
        style={{ width:36, height:36, background:"transparent", border:"none", color:"#a1a1aa", cursor:"pointer", fontSize:18, display:"flex", alignItems:"center", justifyContent:"center", transition:"color 0.15s" }}
        onMouseEnter={e => e.target.style.color="#f4f4f5"} onMouseLeave={e => e.target.style.color="#a1a1aa"}>
        −
      </button>
      <span style={{ minWidth:32, textAlign:"center", color:"#f4f4f5", fontSize:15, fontWeight:600 }}>{value}</span>
      <button type="button" onClick={() => onChange(value + 1)}
        style={{ width:36, height:36, background:"transparent", border:"none", color:"#a1a1aa", cursor:"pointer", fontSize:18, display:"flex", alignItems:"center", justifyContent:"center", transition:"color 0.15s" }}
        onMouseEnter={e => e.target.style.color="#10b981"} onMouseLeave={e => e.target.style.color="#a1a1aa"}>
        +
      </button>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// METRIC CARD (dashboard)
// ─────────────────────────────────────────────────────────────────────────────
function MetricCard({ label, value, icon, color, sub }) {
  const borderColor = color === "emerald" ? "rgba(16,185,129,0.18)" : color === "cyan" ? "rgba(6,182,212,0.18)" : "rgba(245,158,11,0.18)";
  const dotColor    = color === "emerald" ? "#10b981" : color === "cyan" ? "#06b6d4" : "#f59e0b";
  return (
    <div className="metric-card card-glow" style={{
      background:"#111113", border:`1px solid #27272a`,
      borderRadius:12, padding:"18px 20px",
      transition:"all 0.2s ease",
    }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:10 }}>
        <span style={{ fontSize:20 }}>{icon}</span>
        <div style={{ width:8, height:8, borderRadius:"50%", background:dotColor, boxShadow:`0 0 6px ${dotColor}` }} />
      </div>
      <div style={{ fontSize:30, fontWeight:700, color:"#f4f4f5", lineHeight:1 }}>{value}</div>
      <div style={{ fontSize:12, color:"#71717a", marginTop:6, fontWeight:500 }}>{label}</div>
      {sub !== undefined && <div style={{ fontSize:11, color:"#52525b", marginTop:3 }}>{sub}</div>}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// CONVERSION FUNNEL
// ─────────────────────────────────────────────────────────────────────────────
function ConversionFunnel({ metrics }) {
  const steps = [
    { label:"Leads Received",   value: metrics.leadsReceived         || 0, color:"#10b981" },
    { label:"Appts Booked",     value: metrics.appointmentsScheduled || 0, color:"#06b6d4" },
    { label:"Agreements Signed",value: (metrics.vipSellerSigned||0) + (metrics.vipBuyerSigned||0), color:"#a78bfa" },
    { label:"Closed",           value: metrics.closed                || 0, color:"#f59e0b" },
  ];
  const max = steps[0].value || 1;
  return (
    <div style={{ background:"#111113", border:"1px solid #27272a", borderRadius:12, padding:"20px 22px" }}>
      <div style={{ fontSize:13, fontWeight:600, color:"#a1a1aa", marginBottom:16, letterSpacing:"0.05em", textTransform:"uppercase" }}>
        Conversion Funnel
      </div>
      <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
        {steps.map((s, i) => {
          const pct = max > 0 ? Math.round((s.value / max) * 100) : 0;
          const prevVal = i === 0 ? max : steps[i-1].value || 1;
          const convRate = i === 0 ? 100 : prevVal > 0 ? Math.round((s.value / prevVal) * 100) : 0;
          return (
            <div key={s.label}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
                <span style={{ fontSize:13, color:"#d4d4d8", fontWeight:500 }}>{s.label}</span>
                <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                  {i > 0 && <span style={{ fontSize:11, color:"#52525b" }}>{convRate}% from prev</span>}
                  <span style={{ fontSize:16, fontWeight:700, color:s.color }}>{s.value}</span>
                </div>
              </div>
              <div style={{ height:8, background:"#27272a", borderRadius:4, overflow:"hidden" }}>
                <div className="funnel-bar" style={{ height:"100%", width:`${pct}%`, background:s.color, borderRadius:4, minWidth: s.value > 0 ? 4 : 0 }} />
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// TEAM TABLE
// ─────────────────────────────────────────────────────────────────────────────
function TeamTable({ logs, agents, timeframe }) {
  const filtered = filterByTime(logs, timeframe);
  const rows = agents.map(agent => {
    const agentLogs = filtered.filter(l => l.agentName === agent);
    const m = aggregateMetrics(agentLogs);
    return { agent, entries: agentLogs.length, ...m };
  }).filter(r => r.entries > 0 || true);

  const top3Keys = ["leadsReceived","appointmentsScheduled","closed","fiveStarReviews"];

  return (
    <div style={{ background:"#111113", border:"1px solid #27272a", borderRadius:12, overflow:"hidden" }}>
      <div style={{ padding:"16px 20px", borderBottom:"1px solid #27272a" }}>
        <span style={{ fontSize:13, fontWeight:600, color:"#a1a1aa", letterSpacing:"0.05em", textTransform:"uppercase" }}>
          Team Production Board
        </span>
      </div>
      <div style={{ overflowX:"auto" }}>
        <table style={{ width:"100%", borderCollapse:"collapse", minWidth:520 }}>
          <thead>
            <tr style={{ borderBottom:"1px solid #1e1e20" }}>
              <th style={{ textAlign:"left", padding:"10px 20px", fontSize:11, fontWeight:600, color:"#52525b", textTransform:"uppercase", letterSpacing:"0.06em" }}>Agent</th>
              <th style={{ textAlign:"center", padding:"10px 12px", fontSize:11, fontWeight:600, color:"#52525b", textTransform:"uppercase", letterSpacing:"0.06em" }}>Leads</th>
              <th style={{ textAlign:"center", padding:"10px 12px", fontSize:11, fontWeight:600, color:"#52525b", textTransform:"uppercase", letterSpacing:"0.06em" }}>Appts</th>
              <th style={{ textAlign:"center", padding:"10px 12px", fontSize:11, fontWeight:600, color:"#52525b", textTransform:"uppercase", letterSpacing:"0.06em" }}>Closed</th>
              <th style={{ textAlign:"center", padding:"10px 12px", fontSize:11, fontWeight:600, color:"#52525b", textTransform:"uppercase", letterSpacing:"0.06em" }}>★ Reviews</th>
              <th style={{ textAlign:"center", padding:"10px 12px", fontSize:11, fontWeight:600, color:"#52525b", textTransform:"uppercase", letterSpacing:"0.06em" }}>Entries</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r, i) => (
              <tr key={r.agent} className="table-row" style={{ borderBottom:"1px solid #1a1a1c" }}>
                <td style={{ padding:"12px 20px" }}>
                  <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                    <div style={{
                      width:28, height:28, borderRadius:"50%",
                      background:`linear-gradient(135deg, ${i%3===0?"#10b981":i%3===1?"#06b6d4":"#a78bfa"}, ${i%3===0?"#059669":i%3===1?"#0891b2":"#7c3aed"})`,
                      display:"flex", alignItems:"center", justifyContent:"center",
                      fontSize:11, fontWeight:700, color:"white", flexShrink:0,
                    }}>
                      {r.agent.charAt(0).toUpperCase()}
                    </div>
                    <span style={{ fontSize:13, fontWeight:500, color:"#d4d4d8" }}>{r.agent}</span>
                  </div>
                </td>
                <td style={{ textAlign:"center", padding:"12px", fontSize:14, fontWeight:600, color: r.leadsReceived > 0 ? "#10b981" : "#3f3f46" }}>{r.leadsReceived}</td>
                <td style={{ textAlign:"center", padding:"12px", fontSize:14, fontWeight:600, color: r.appointmentsScheduled > 0 ? "#06b6d4" : "#3f3f46" }}>{r.appointmentsScheduled}</td>
                <td style={{ textAlign:"center", padding:"12px", fontSize:14, fontWeight:600, color: r.closed > 0 ? "#f59e0b" : "#3f3f46" }}>{r.closed}</td>
                <td style={{ textAlign:"center", padding:"12px", fontSize:14, fontWeight:600, color: r.fiveStarReviews > 0 ? "#f59e0b" : "#3f3f46" }}>{r.fiveStarReviews}</td>
                <td style={{ textAlign:"center", padding:"12px" }}>
                  <span className={`badge ${r.entries > 0 ? "badge-emerald" : "badge-zinc"}`}>{r.entries}</span>
                </td>
              </tr>
            ))}
            {rows.length === 0 && (
              <tr><td colSpan={6} style={{ textAlign:"center", padding:"32px", color:"#52525b", fontSize:13 }}>No data for this period.</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// DASHBOARD SCREEN
// ─────────────────────────────────────────────────────────────────────────────
function Dashboard({ logs, agents, syncStatus }) {
  const [timeframe, setTimeframe] = React.useState("monthly");
  const [agentFilter, setAgentFilter] = React.useState("all");

  const filtered = React.useMemo(() => {
    let l = filterByTime(logs, timeframe);
    if (agentFilter !== "all") l = l.filter(x => x.agentName === agentFilter);
    return l;
  }, [logs, timeframe, agentFilter]);

  const metrics = React.useMemo(() => aggregateMetrics(filtered), [filtered]);

  const tfBtnStyle = (tf) => ({
    padding:"6px 16px", borderRadius:6, border:"none", cursor:"pointer", fontSize:12, fontWeight:600,
    background: timeframe === tf ? "#10b981" : "transparent",
    color: timeframe === tf ? "white" : "#71717a",
    transition:"all 0.15s ease",
  });

  return (
    <div className="fade-in" style={{ maxWidth:1200, margin:"0 auto", padding:"0 0 40px" }}>

      {/* Header row */}
      <div style={{ display:"flex", flexWrap:"wrap", alignItems:"center", justifyContent:"space-between", gap:14, marginBottom:24 }}>
        <div>
          <div style={{ fontSize:22, fontWeight:700, color:"#f4f4f5" }}>
            Brokerage Dashboard
          </div>
          <div style={{ fontSize:13, color:"#52525b", marginTop:2 }}>
            {syncStatus === "synced" && <span style={{color:"#10b981"}}>● Live data synced</span>}
            {syncStatus === "local"  && <span style={{color:"#f59e0b"}}>● Offline — local data only</span>}
            {syncStatus === "loading"&& <span style={{color:"#71717a"}}>● Syncing…</span>}
          </div>
        </div>
        <div style={{ display:"flex", gap:10, flexWrap:"wrap", alignItems:"center" }}>
          {/* Timeframe selector */}
          <div style={{ display:"flex", background:"#18181b", border:"1px solid #27272a", borderRadius:8, padding:3, gap:2 }}>
            {["daily","weekly","monthly"].map(tf => (
              <button key={tf} style={tfBtnStyle(tf)} onClick={() => setTimeframe(tf)}>
                {tf.charAt(0).toUpperCase()+tf.slice(1)}
              </button>
            ))}
          </div>
          {/* Agent filter */}
          <select value={agentFilter} onChange={e => setAgentFilter(e.target.value)}
            style={{ background:"#18181b", border:"1px solid #27272a", color:"#d4d4d8", borderRadius:8, padding:"7px 12px", fontSize:13, cursor:"pointer" }}>
            <option value="all">All Agents</option>
            {agents.map(a => <option key={a} value={a}>{a}</option>)}
          </select>
        </div>
      </div>

      {/* Metrics grid */}
      <div style={{
        display:"grid",
        gridTemplateColumns:"repeat(auto-fill, minmax(160px, 1fr))",
        gap:12, marginBottom:20,
      }}>
        {METRIC_KEYS.map(m => (
          <MetricCard key={m.key} label={m.label} value={metrics[m.key] || 0} icon={m.icon} color={m.color} />
        ))}
      </div>

      {/* Funnel + Table row */}
      <div style={{ display:"grid", gridTemplateColumns:"minmax(0,1fr) minmax(0,1.8fr)", gap:14 }}>
        <div style={{ minWidth:0 }}>
          <ConversionFunnel metrics={metrics} />
        </div>
        <div style={{ minWidth:0 }}>
          <TeamTable logs={logs} agents={agents} timeframe={timeframe} />
        </div>
      </div>

      {/* Summary stats bar */}
      <div style={{ marginTop:14, background:"#111113", border:"1px solid #27272a", borderRadius:12, padding:"16px 22px", display:"flex", flexWrap:"wrap", gap:24 }}>
        {[
          { label:"Total Entries", value: filtered.length },
          { label:"Unique Agents Active", value: new Set(filtered.map(l=>l.agentName)).size },
          { label:"Offers → Contract Rate", value: metrics.offersSubmitted ? Math.round((metrics.underContract/metrics.offersSubmitted)*100)+"%": "—" },
          { label:"Lead → Appointment Rate", value: metrics.leadsReceived ? Math.round((metrics.appointmentsScheduled/metrics.leadsReceived)*100)+"%": "—" },
        ].map(s => (
          <div key={s.label}>
            <div style={{ fontSize:11, color:"#52525b", fontWeight:600, textTransform:"uppercase", letterSpacing:"0.06em" }}>{s.label}</div>
            <div style={{ fontSize:20, fontWeight:700, color:"#f4f4f5", marginTop:2 }}>{s.value}</div>

  );
}

// ─────────────────────────────────────────────────────────────────────────────
// LOG ACTIVITY SCREEN
// ─────────────────────────────────────────────────────────────────────────────
function LogActivity({ agents, onSubmit, addToast }) {
  const initMetrics = () => EMPTY_METRICS();
  const [agentName,    setAgentName]    = React.useState(agents[0] || "");
  const [leadSource,   setLeadSource]   = React.useState("");
  const [customSource, setCustomSource] = React.useState("");
  const [timeline36,   setTimeline36]   = React.useState(false);
  const [clientName,   setClientName]   = React.useState("");
  const [clientEmail,  setClientEmail]  = React.useState("");
  const [clientPhone,  setClientPhone]  = React.useState("");
  const [notes,        setNotes]        = React.useState("");
  const [metrics,      setMetrics]      = React.useState(initMetrics());
  const [errors,       setErrors]       = React.useState({});
  const [submitting,   setSubmitting]   = React.useState(false);

  const setMetric = (key, val) => setMetrics(prev => ({ ...prev, [key]: Math.max(0, val) }));

  const validate = () => {
    const e = {};
    if (!agentName.trim())                            e.agentName    = "Please select your name.";
    if (!leadSource)                                  e.leadSource   = "Please select a lead source.";
    if (leadSource === "Other" && !customSource.trim()) e.customSource = "Please specify the custom source.";
    if (!clientName.trim())                           e.clientName   = "Client name is required.";
    if (!clientEmail.trim())                          e.clientEmail  = "Client email is required.";
    else if (!/\S+@\S+\.\S+/.test(clientEmail))      e.clientEmail  = "Enter a valid email address.";
    if (!clientPhone.trim())                          e.clientPhone  = "Client phone is required.";
    if (!notes.trim())                                e.notes        = "Notes / property details are required.";
    return e;
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    const errs = validate();
    setErrors(errs);
    if (Object.keys(errs).length > 0) {
      addToast("Please fix the highlighted fields before submitting.", "error");
      return;
    }

    const payload = {
      timestamp:    new Date().toISOString(),
      agentName:    agentName.trim(),
      leadSource:   leadSource === "Other" ? customSource.trim() : leadSource,
      timeline36,
      clientName:   clientName.trim(),
      clientEmail:  clientEmail.trim(),
      clientPhone:  clientPhone.trim(),
      notes:        notes.trim(),
      metrics,
    };

    setSubmitting(true);
    try {
      const isPlaceholder = GOOGLE_WEB_APP_URL.includes("YOUR_SCRIPT_ID");
      if (!isPlaceholder) {
        const res = await fetch(GOOGLE_WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          mode: "no-cors",
        });
      }
      await onSubmit(payload);
      addToast("Activity encoded successfully! Data saved.", "success");
      // Reset form
      setLeadSource(""); setCustomSource(""); setTimeline36(false);
      setClientName(""); setClientEmail(""); setClientPhone(""); setNotes("");
      setMetrics(initMetrics()); setErrors({});
    } catch (err) {
      await onSubmit(payload);
      addToast("Saved locally. Google Sheets sync may be pending.", "success");
    } finally {
      setSubmitting(false);
    }
  };

  const fieldStyle = (key) => ({ className: `input-base${errors[key] ? " input-error" : ""}` });

  const SectionHeader = ({ children }) => (
    <div style={{ fontSize:11, fontWeight:700, color:"#52525b", textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:14, marginTop:4 }}>
      {children}
    </div>
  );

  const FieldError = ({ field }) => errors[field] ? (
    <div style={{ display:"flex", alignItems:"center", gap:5, marginTop:5, color:"#f87171", fontSize:12 }}>
      <IconAlert />{errors[field]}
    </div>
  ) : null;

  return (
    <div className="fade-in" style={{ maxWidth:740, margin:"0 auto", padding:"0 0 60px" }}>
      <div style={{ marginBottom:24 }}>
        <div style={{ fontSize:22, fontWeight:700, color:"#f4f4f5" }}>Log Activity</div>
        <div style={{ fontSize:13, color:"#52525b", marginTop:2 }}>Encode a new client interaction or transaction event</div>
      </div>

      <form onSubmit={handleSubmit} noValidate>

        {/* ── AGENT & SOURCE ── */}
        <div style={{ background:"#111113", border:"1px solid #27272a", borderRadius:14, padding:"22px 24px", marginBottom:14 }}>
          <SectionHeader>Agent & Lead Source</SectionHeader>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14 }}>
            <div>
              <label style={{ fontSize:12, fontWeight:500, color:"#a1a1aa", display:"block", marginBottom:6 }}>Your Name *</label>
              <select value={agentName} onChange={e => setAgentName(e.target.value)}
                className={`input-base${errors.agentName ? " input-error" : ""}`}
                style={{ background:"#18181b", border:`1px solid ${errors.agentName?"#f87171":"#27272a"}`, color:"#f4f4f5", borderRadius:8, padding:"10px 14px", width:"100%", fontSize:14 }}>
                <option value="">— Select Agent —</option>
                {agents.map(a => <option key={a} value={a}>{a}</option>)}
              </select>
              <FieldError field="agentName" />
            </div>
            <div>
              <label style={{ fontSize:12, fontWeight:500, color:"#a1a1aa", display:"block", marginBottom:6 }}>Lead Source *</label>
              <select value={leadSource} onChange={e => { setLeadSource(e.target.value); setCustomSource(""); }}
                style={{ background:"#18181b", border:`1px solid ${errors.leadSource?"#f87171":"#27272a"}`, color: leadSource ? "#f4f4f5" : "#52525b", borderRadius:8, padding:"10px 14px", width:"100%", fontSize:14 }}>
                <option value="">— Select Source —</option>
                {LEAD_SOURCES.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
              <FieldError field="leadSource" />
            </div>
          </div>

          {/* Custom source conditional */}
          {leadSource === "Other" && (
            <div style={{ marginTop:14 }}>
              <label style={{ fontSize:12, fontWeight:500, color:"#a1a1aa", display:"block", marginBottom:6 }}>
                Specify Custom Source <span style={{color:"#f87171"}}>*</span>
              </label>
              <input type="text" value={customSource} onChange={e => setCustomSource(e.target.value)}
                placeholder="Describe the lead source (e.g. Instagram Ad, Podcast, etc.)"
                style={{ background:"#18181b", border:`1px solid ${errors.customSource?"#f87171":"#27272a"}`, color:"#f4f4f5", borderRadius:8, padding:"10px 14px", width:"100%", fontSize:14 }}
                className={errors.customSource ? "input-error" : ""} />
              <FieldError field="customSource" />
            </div>
          )}

          {/* 3–6 month timeline toggle */}
          <div style={{ marginTop:20, padding:"16px", background:"#18181b", borderRadius:10, border:"1px solid #27272a" }}>
            <Toggle
              checked={timeline36}
              onChange={setTimeline36}
              label="Considering a move in the next 3–6 months?"
              sublabel="Toggle ON if this lead is actively planning within this window"
            />
          </div>
        </div>

        {/* ── CLIENT DETAILS ── */}
        <div style={{ background:"#111113", border:"1px solid #27272a", borderRadius:14, padding:"22px 24px", marginBottom:14 }}>
          <SectionHeader>Client Details <span style={{color:"#f87171",fontWeight:400}}>(all fields required)</span></SectionHeader>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14 }}>
            <div>
              <label style={{ fontSize:12, fontWeight:500, color:"#a1a1aa", display:"block", marginBottom:6 }}>Client Name *</label>
              <input type="text" value={clientName} onChange={e => setClientName(e.target.value)} placeholder="Full name"
                style={{ background:"#18181b", border:`1px solid ${errors.clientName?"#f87171":"#27272a"}`, color:"#f4f4f5", borderRadius:8, padding:"10px 14px", width:"100%", fontSize:14 }} />
              <FieldError field="clientName" />
            </div>
            <div>
              <label style={{ fontSize:12, fontWeight:500, color:"#a1a1aa", display:"block", marginBottom:6 }}>Client Phone *</label>
              <input type="tel" value={clientPhone} onChange={e => setClientPhone(e.target.value)} placeholder="(555) 000-0000"
                style={{ background:"#18181b", border:`1px solid ${errors.clientPhone?"#f87171":"#27272a"}`, color:"#f4f4f5", borderRadius:8, padding:"10px 14px", width:"100%", fontSize:14 }} />
              <FieldError field="clientPhone" />
            </div>
          </div>
          <div style={{ marginTop:14 }}>
            <label style={{ fontSize:12, fontWeight:500, color:"#a1a1aa", display:"block", marginBottom:6 }}>Client Email *</label>
            <input type="email" value={clientEmail} onChange={e => setClientEmail(e.target.value)} placeholder="client@email.com"
              style={{ background:"#18181b", border:`1px solid ${errors.clientEmail?"#f87171":"#27272a"}`, color:"#f4f4f5", borderRadius:8, padding:"10px 14px", width:"100%", fontSize:14 }} />
            <FieldError field="clientEmail" />
          </div>
          <div style={{ marginTop:14 }}>
            <label style={{ fontSize:12, fontWeight:500, color:"#a1a1aa", display:"block", marginBottom:6 }}>Notes / Property Details *</label>
            <textarea value={notes} onChange={e => setNotes(e.target.value)} rows={4}
              placeholder="Describe the interaction, property address, client needs, price range, timeline details, next steps…"
              style={{ background:"#18181b", border:`1px solid ${errors.notes?"#f87171":"#27272a"}`, color:"#f4f4f5", borderRadius:8, padding:"10px 14px", width:"100%", fontSize:14, resize:"vertical", fontFamily:"inherit" }} />
            <FieldError field="notes" />
          </div>
        </div>

        {/* ── ACTIVITY METRICS ── */}
        <div style={{ background:"#111113", border:"1px solid #27272a", borderRadius:14, padding:"22px 24px", marginBottom:20 }}>
          <SectionHeader>Activity Metrics</SectionHeader>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(240px, 1fr))", gap:14 }}>
            {METRIC_KEYS.map(m => (
              <div key={m.key} style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:12, padding:"10px 14px", background:"#18181b", borderRadius:9, border:"1px solid #27272a" }}>
                <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                  <span style={{ fontSize:16 }}>{m.icon}</span>
                  <span style={{ fontSize:13, color:"#d4d4d8", fontWeight:500 }}>{m.label}</span>
                </div>
                <CounterInput value={metrics[m.key]} onChange={v => setMetric(m.key, v)} />
              </div>
            ))}
          </div>
        </div>

        {/* ── SUBMIT ── */}
        <button type="submit" className="btn-primary" disabled={submitting} style={{ width:"100%", padding:"14px" }}>
          {submitting ? (
            <><IconSpinner /> Encoding Activity…</>
          ) : (
            <><IconCheck /> Encode Activity</>
          )}
        </button>

      </form>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// ACTIVITY LOG SCREEN
// ─────────────────────────────────────────────────────────────────────────────
function ActivityLog({ logs, agents }) {
  const [search, setSearch]         = React.useState("");
  const [agentFilter, setAgentFilter] = React.useState("all");
  const [page, setPage]             = React.useState(1);
  const PER_PAGE = 20;

  const sorted = React.useMemo(() => [...logs].sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp)), [logs]);

  const filtered = React.useMemo(() => {
    let l = sorted;
    if (agentFilter !== "all") l = l.filter(x => x.agentName === agentFilter);
    if (search.trim()) {
      const q = search.toLowerCase();
      l = l.filter(x =>
        x.clientName?.toLowerCase().includes(q) ||
        x.agentName?.toLowerCase().includes(q)  ||
        x.leadSource?.toLowerCase().includes(q) ||
        x.notes?.toLowerCase().includes(q)      ||
        x.clientEmail?.toLowerCase().includes(q)
      );
    }
    return l;
  }, [sorted, agentFilter, search]);

  const totalPages = Math.ceil(filtered.length / PER_PAGE);
  const paged = filtered.slice((page-1)*PER_PAGE, page*PER_PAGE);

  React.useEffect(() => { setPage(1); }, [search, agentFilter]);

  const sourceColor = (src) => {
    if (!src) return "badge-zinc";
    const s = src.toLowerCase();
    if (s.includes("zillow"))  return "badge-cyan";
    if (s.includes("radio"))   return "badge-amber";
    if (s.includes("referral"))return "badge-emerald";
    if (s.includes("open"))    return "badge-amber";
    return "badge-zinc";
  };

  return (
    <div className="fade-in" style={{ maxWidth:1100, margin:"0 auto", padding:"0 0 60px" }}>
      <div style={{ marginBottom:24 }}>
        <div style={{ fontSize:22, fontWeight:700, color:"#f4f4f5" }}>Activity Log</div>
        <div style={{ fontSize:13, color:"#52525b", marginTop:2 }}>Master ledger — {logs.length} total entries</div>
      </div>

      {/* Filters */}
      <div style={{ display:"flex", gap:12, marginBottom:16, flexWrap:"wrap" }}>
        <input type="text" value={search} onChange={e => setSearch(e.target.value)}
          placeholder="Search clients, agents, notes…"
          style={{ background:"#111113", border:"1px solid #27272a", color:"#d4d4d8", borderRadius:8, padding:"9px 14px", fontSize:13, flex:1, minWidth:200, fontFamily:"inherit" }} />
        <select value={agentFilter} onChange={e => setAgentFilter(e.target.value)}
          style={{ background:"#111113", border:"1px solid #27272a", color:"#d4d4d8", borderRadius:8, padding:"9px 12px", fontSize:13, cursor:"pointer" }}>
          <option value="all">All Agents</option>
          {agents.map(a => <option key={a} value={a}>{a}</option>)}
        </select>
      </div>

      {/* Log cards — mobile friendly */}
      <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
        {paged.length === 0 && (
          <div style={{ textAlign:"center", padding:"60px 0", color:"#3f3f46", fontSize:14 }}>
            No entries found{search || agentFilter !== "all" ? " matching your filters" : ""}. Log your first activity above.
          </div>
        )}
        {paged.map((entry, i) => (
          <div key={entry.id || i} style={{ background:"#111113", border:"1px solid #27272a", borderRadius:12, padding:"18px 20px" }}>
            {/* Top row */}
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", flexWrap:"wrap", gap:8, marginBottom:12 }}>
              <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                <div style={{
                  width:32, height:32, borderRadius:"50%",
                  background:"linear-gradient(135deg,#10b981,#059669)",
                  display:"flex", alignItems:"center", justifyContent:"center",
                  fontSize:12, fontWeight:700, color:"white", flexShrink:0,
                }}>
                  {(entry.agentName||"?").charAt(0).toUpperCase()}
                </div>
                <div>
                  <div style={{ fontSize:13, fontWeight:600, color:"#f4f4f5" }}>{entry.agentName}</div>
                  <div style={{ fontSize:11, color:"#52525b" }}>{formatTS(entry.timestamp)}</div>
                </div>
              </div>
              <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                <span className={`badge ${sourceColor(entry.leadSource)}`}>{entry.leadSource || "Unknown"}</span>
                {entry.timeline36 && <span className="badge badge-emerald">3–6 mo ready</span>}
              </div>
            </div>

            {/* Client info */}
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(180px,1fr))", gap:10, marginBottom:12, padding:"12px 14px", background:"#18181b", borderRadius:9, border:"1px solid #1e1e20" }}>
              <div>
                <div style={{ fontSize:10, color:"#52525b", fontWeight:600, textTransform:"uppercase", letterSpacing:"0.06em" }}>Client</div>
                <div style={{ fontSize:13, color:"#d4d4d8", marginTop:2, fontWeight:500 }}>{entry.clientName}</div>
              </div>
              <div>
                <div style={{ fontSize:10, color:"#52525b", fontWeight:600, textTransform:"uppercase", letterSpacing:"0.06em" }}>Email</div>
                <div style={{ fontSize:13, color:"#d4d4d8", marginTop:2 }}>{entry.clientEmail}</div>
              </div>
              <div>
                <div style={{ fontSize:10, color:"#52525b", fontWeight:600, textTransform:"uppercase", letterSpacing:"0.06em" }}>Phone</div>
                <div style={{ fontSize:13, color:"#d4d4d8", marginTop:2 }}>{entry.clientPhone}</div>
              </div>
            </div>

            {/* Notes */}
            {entry.notes && (
              <div style={{ fontSize:13, color:"#71717a", lineHeight:1.6, marginBottom:12 }}>{entry.notes}</div>
            )}

            {/* Metric chips */}
            {entry.metrics && (
              <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
                {METRIC_KEYS.filter(m => (entry.metrics[m.key]||0) > 0).map(m => (
                  <span key={m.key} style={{
                    fontSize:11, fontWeight:600, padding:"3px 9px", borderRadius:6,
                    background:"#1e1e20", color:"#a1a1aa", border:"1px solid #27272a",
                    display:"flex", alignItems:"center", gap:4,
                  }}>
                    {m.icon} {m.label}: <span style={{color:"#f4f4f5"}}>{entry.metrics[m.key]}</span>
                  </span>
                ))}
              </div>
            )}
          </div>
        ))}
      </div>

      {/* Pagination */}
      {totalPages > 1 && (
        <div style={{ display:"flex", justifyContent:"center", alignItems:"center", gap:8, marginTop:20 }}>
          <button onClick={() => setPage(p => Math.max(1, p-1))} disabled={page===1}
            style={{ background:"#18181b", border:"1px solid #27272a", color: page===1 ? "#3f3f46" : "#d4d4d8", borderRadius:7, padding:"7px 14px", cursor: page===1?"not-allowed":"pointer", fontSize:13 }}>
            ← Prev
          </button>
          <span style={{ fontSize:13, color:"#71717a" }}>Page {page} of {totalPages}</span>
          <button onClick={() => setPage(p => Math.min(totalPages, p+1))} disabled={page===totalPages}
            style={{ background:"#18181b", border:"1px solid #27272a", color: page===totalPages?"#3f3f46":"#d4d4d8", borderRadius:7, padding:"7px 14px", cursor: page===totalPages?"not-allowed":"pointer", fontSize:13 }}>
            Next →
          </button>
        </div>
      )}
    </div>
  );
}

// ROOT APP

function App() {
  const [screen,     setScreen]     = React.useState("dashboard");
  const [logs,       setLogs]       = React.useState([]);
  const [agents,     setAgents]     = React.useState(DEFAULT_AGENTS);
  const [toasts,     setToasts]     = React.useState([]);
  const [syncStatus, setSyncStatus] = React.useState("loading");
  const toastId = React.useRef(0);

  const addToast = React.useCallback((message, type="success") => {
    const id = ++toastId.current;
    setToasts(prev => [...prev, { id, message, type }]);
    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4500);
  }, []);

  const removeToast = React.useCallback((id) => {
    setToasts(prev => prev.filter(t => t.id !== id));
  }, []);

  // Bootstrap: load local then attempt Google Sheets fetch
  React.useEffect(() => {
    const local = loadLocal();
    if (local) {
      setLogs(local.logs || []);
      if (local.agents?.length) setAgents(local.agents);
    }

    const isPlaceholder = GOOGLE_WEB_APP_URL.includes("YOUR_SCRIPT_ID");
    if (isPlaceholder) {
      setSyncStatus("local");
      return;
    }

    fetch(GOOGLE_WEB_APP_URL + "?action=get", { mode:"no-cors" })
      .then(res => {
        if (res.type === "opaque") {
          // no-cors — we can't read body; treat as unavailable
          setSyncStatus("local");
          return;
        }
        return res.json();
      })
      .then(data => {
        if (!data) return;
        if (data.agents?.length) setAgents(data.agents);
        if (data.logs?.length)   setLogs(prev => {
          const ids = new Set(prev.map(l=>l.id));
          const merged = [...prev, ...data.logs.filter(l => !ids.has(l.id))];
          merged.sort((a,b) => new Date(b.timestamp)-new Date(a.timestamp));
          return merged;
        });
        setSyncStatus("synced");
      })
      .catch(() => setSyncStatus("local"));
  }, []);

  // Persist to localStorage whenever logs change
  React.useEffect(() => {
    saveLocal({ logs, agents });
  }, [logs, agents]);

  const handleSubmit = React.useCallback(async (payload) => {
    const entry = { ...payload, id: `${Date.now()}-${Math.random().toString(36).slice(2,7)}` };
    setLogs(prev => [entry, ...prev]);
  }, []);

  const NAV = [
    { id:"dashboard", label:"Dashboard", Icon:IconDashboard },
    { id:"log",       label:"Log Activity", Icon:IconLog   },
    { id:"actlog",    label:"Activity Log", Icon:IconList  },
  ];

  const navItemStyle = (id) => ({
    display:"flex", alignItems:"center", gap:8,
    padding:"9px 16px", borderRadius:8, cursor:"pointer", border:"none",
    background: screen === id ? "rgba(16,185,129,0.12)" : "transparent",
    color: screen === id ? "#10b981" : "#71717a",
    fontSize:14, fontWeight: screen === id ? 600 : 500,
    transition:"all 0.15s ease",
    textDecoration:"none",
  });

  return (
    <div style={{ minHeight:"100vh", background:"#09090b" }}>

      {/* ── TOP NAV ── */}
      <nav className="nav-glow" style={{
        background:"rgba(9,9,11,0.95)",
        backdropFilter:"blur(12px)",
        borderBottom:"1px solid #18181b",
        position:"sticky", top:0, zIndex:100,
        padding:"0 20px",
      }}>
        <div style={{ maxWidth:1200, margin:"0 auto", display:"flex", alignItems:"center", justifyContent:"space-between", height:58 }}>
          {/* Brand */}
          <div style={{ display:"flex", alignItems:"center", gap:10 }}>
            <div style={{
              width:32, height:32, borderRadius:8,
              background:"linear-gradient(135deg, #10b981, #06b6d4)",
              display:"flex", alignItems:"center", justifyContent:"center",
              fontSize:14, fontWeight:800, color:"white",
            }}>B</div>
            <div>
              <div style={{ fontSize:14, fontWeight:700, color:"#f4f4f5", lineHeight:1.1 }}>Barb's Brokerage</div>
              <div style={{ fontSize:10, color:"#52525b", fontWeight:500 }}>ACTIVITY TRACKER</div>
            </div>
          </div>

          {/* Nav links — hidden on very small mobile, shown as bottom bar instead */}
          <div className="desktop-nav" style={{ display:"flex", gap:4, alignItems:"center" }}>
            {NAV.map(n => (
              <button key={n.id} style={navItemStyle(n.id)} onClick={() => setScreen(n.id)}>
                <n.Icon /><span className="nav-label">{n.label}</span>
              </button>
            ))}
          </div>

          {/* Sync badge */}
          <div style={{ display:"flex", alignItems:"center", gap:8 }}>
            <div style={{
              display:"flex", alignItems:"center", gap:6, padding:"4px 10px",
              background:"#18181b", borderRadius:20, border:"1px solid #27272a",
            }}>
              <IconCloud />
              <span style={{ fontSize:11, fontWeight:600, color: syncStatus==="synced"?"#10b981": syncStatus==="local"?"#f59e0b":"#71717a" }}>
                {syncStatus === "synced" ? "Synced" : syncStatus === "local" ? "Local" : "Syncing…"}
              </span>
            </div>
          </div>
        </div>
      </nav>

      {/* ── MAIN CONTENT ── */}
      <main style={{ padding:"28px 20px", maxWidth:1200, margin:"0 auto" }}>
        {screen === "dashboard" && <Dashboard logs={logs} agents={agents} syncStatus={syncStatus} />}
        {screen === "log"       && <LogActivity agents={agents} onSubmit={handleSubmit} addToast={addToast} />}
        {screen === "actlog"    && <ActivityLog logs={logs} agents={agents} />}
      </main>

      {/* ── MOBILE BOTTOM NAV ── */}
      <div style={{
        position:"fixed", bottom:0, left:0, right:0,
        background:"rgba(9,9,11,0.97)",
        backdropFilter:"blur(12px)",
        borderTop:"1px solid #18181b",
        display:"none",
        zIndex:100,
      }} id="mobile-nav">
        {NAV.map(n => (
          <button key={n.id} onClick={() => setScreen(n.id)}
            style={{
              flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
              padding:"10px 4px 8px",
              background:"transparent", border:"none", cursor:"pointer",
              color: screen === n.id ? "#10b981" : "#52525b",
              fontSize:10, fontWeight:600, gap:4,
              transition:"color 0.15s",
            }}>
            <n.Icon />
            {n.label}
          </button>
        ))}
      </div>

      {/* ── TOASTS ── */}
      <Toast toasts={toasts} removeToast={removeToast} />

      <style>{`
        @media (max-width: 640px) {
          #mobile-nav { display: flex !important; }
          main { padding-bottom: 80px !important; }
          .desktop-nav { display: none !important; }
          .nav-label { display: none; }
        }
        @media (min-width: 641px) and (max-width: 900px) {
          div[style*="gridTemplateColumns: minmax(0,1fr) minmax(0,1.8fr)"] {
            grid-template-columns: 1fr !important;
          }
        }
        @media (max-width: 500px) {
          div[style*="gridTemplateColumns: 1fr 1fr"] {
            grid-template-columns: 1fr !important;
          }
          div[style*="gridTemplateColumns: repeat(auto-fill, minmax(240px, 1fr))"] {
            grid-template-columns: 1fr !important;
          }
        }
      `}</style>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
